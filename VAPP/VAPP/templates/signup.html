<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPP | Create Account</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:28px 16px;display:flex;align-items:center;justify-content:center;background:#07111f;color:#eaf2ff;font-family:Arial,sans-serif}
    .card{width:100%;max-width:470px;padding:34px 40px;background:#0d1b2a;border:1px solid #1d4e89;border-radius:18px;box-shadow:0 0 35px #0096ff20}
    .brand{text-align:center;margin-bottom:24px}.brand h1{margin:0;color:#38bdf8;font-size:30px}.brand p{margin:8px 0 0;color:#94a3b8}
    label{display:block;margin:16px 0 7px;color:#d7e4f5}.field{position:relative}.field input,.plain{width:100%;height:45px;padding:12px 14px;border:1px solid #334155;border-radius:8px;background:#081421;color:#fff;outline:none;font-size:14px}.field input:focus,.plain:focus{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf833}.field input{padding-right:52px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:34px;border:0;background:transparent;color:#94a3b8;cursor:pointer;display:grid;place-items:center}.toggle:hover{color:#38bdf8}.toggle svg{width:21px;height:21px}
    .submit{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:#0284c7;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.submit:hover{background:#0369a1}.message{margin:0 0 14px;text-align:center;color:#fca5a5;font-size:14px}.foot{text-align:center;margin-top:20px;color:#94a3b8}.foot a{color:#38bdf8;text-decoration:none}.hint{font-size:12px;color:#94a3b8;margin-top:6px;line-height:1.4}
    @media(max-width:480px){.card{padding:28px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <header class="brand"><h1>VAPP</h1><p>Create your security analyst account</p></header>
    {% with messages = get_flashed_messages() %}{% if messages %}{% for message in messages %}<div class="message" role="alert">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="POST" action="{{ url_for('signup') }}" id="signupForm" autocomplete="on">
      <label for="name">Name</label>
      <input class="plain" type="text" id="name" name="name" placeholder="Your name" value="{{ name|default('') }}" autocomplete="name" maxlength="100" required>
      <label for="email">Email</label>
      <input class="plain" type="email" id="email" name="email" placeholder="your@email.com" value="{{ email|default('') }}" autocomplete="email" required>
      <label for="password">Password</label>
      <div class="field"><input type="password" id="password" name="password" placeholder="Create a password (at least 8 characters)" autocomplete="new-password" minlength="8" required>
        <button class="toggle" type="button" data-toggle="password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="hint">Use at least 8 characters. Your password is stored as a secure hash.</div>
      <label for="confirm_password">Confirm password</label>
      <div class="field"><input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
        <button class="toggle" type="button" data-toggle="confirm_password" aria-label="Show confirm password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="submit" type="submit">Create Account</button>
    </form>
    <div class="foot">Already have an account? <a href="{{ url_for('login') }}">Login</a></div>
  </main>
  <script>
    document.querySelectorAll('[data-toggle]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.toggle);
        const showing = input.type === 'password'; input.type = showing ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(showing));
        button.setAttribute('aria-label', (showing ? 'Hide ' : 'Show ') + (input.id === 'password' ? 'password' : 'confirm password'));
      });
    });
    const form=document.getElementById('signupForm'), password=document.getElementById('password'), confirm=document.getElementById('confirm_password');
    function validateMatch(){confirm.setCustomValidity(confirm.value && password.value !== confirm.value ? 'Passwords do not match.' : '');}
    password.addEventListener('input', validateMatch); confirm.addEventListener('input', validateMatch);
    form.addEventListener('submit', e=>{validateMatch(); if(!form.checkValidity()){e.preventDefault();form.reportValidity();}});
  </script>
</body>
</html>
