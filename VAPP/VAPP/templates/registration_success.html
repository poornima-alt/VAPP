<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VAPP | Account Created</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#07111f;color:#eaf2ff;font-family:Arial,sans-serif}.card{width:100%;max-width:520px;padding:38px;background:#0d1b2a;border:1px solid #1d4e89;border-radius:18px;text-align:center;box-shadow:0 0 35px #0096ff20}h1{color:#38bdf8;margin:0 0 10px}.ok{color:#86efac;font-weight:bold}.muted{color:#94a3b8;line-height:1.5}.code{margin:20px 0;padding:18px 12px;border:1px dashed #38bdf8;border-radius:10px;background:#081421;color:#f8fafc;font-family:Consolas,monospace;font-size:clamp(17px,4vw,23px);overflow-wrap:anywhere;letter-spacing:1px;user-select:all}.btn{display:inline-block;margin:8px 5px;padding:12px 18px;border:0;border-radius:8px;background:#0284c7;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.secondary{background:#334155}.warning{font-size:13px;color:#fbbf24;margin-top:14px}</style></head>
<body><main class="card"><h1>VAPP</h1><p class="ok">Account created successfully!</p><p class="muted">Welcome, {{ name|e }}. Your VAPP registration reference code is:</p><div class="code" id="registrationCode">{{ registration_code }}</div><button class="btn" type="button" id="copyCode">Copy registration code</button><a class="btn secondary" href="{{ url_for('login') }}">Continue to Login</a><p class="warning">Save this reference code somewhere safe. It is not your password and cannot be used to sign in.</p><p class="muted">Registered email: {{ email|e }}</p></main><script>document.getElementById('copyCode').addEventListener('click',async()=>{const code=document.getElementById('registrationCode').textContent.trim();const button=document.getElementById('copyCode');try{await navigator.clipboard.writeText(code);button.textContent='Copied!';}catch(e){const range=document.createRange();range.selectNodeContents(document.getElementById('registrationCode'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);button.textContent='Select and copy the code';}});</script></body></html>
